[package]
name = "terminal-ime-desktop"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "TerminalIME"
path = "src/main.rs"

[dependencies]
terminal-ime = { path = ".." }
gpui = { version = "=0.2.2", default-features = false }
raw-window-handle = "0.6"
serde_json = "1"
windows = { version = "=0.58.0", features = ["Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Graphics_Gdi"] }

[build-dependencies]
embed-resource = "3"
